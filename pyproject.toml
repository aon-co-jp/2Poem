[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "topoem"
version = "0.1.4"
description = "Convert Flask / Django / FastAPI systems to Rust + Poem or RPoem, and follow new releases of Python, Rust, JavaScript, TypeScript, React, Bootstrap, WunderGraph Cosmo and databases."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["flask", "django", "fastapi", "rust", "poem", "rpoem", "migration"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Code Generators",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/aon-co-jp/2Poem"
Source = "https://github.com/aon-co-jp/2Poem"
Issues = "https://github.com/aon-co-jp/2Poem/issues"

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
"2poem" = "topoem.cli:main"
topoem = "topoem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
